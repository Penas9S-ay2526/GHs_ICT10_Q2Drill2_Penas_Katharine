<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill 2</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Background decorations -->
    <div class="gear gear-one" aria-hidden="true">⚙</div>
    <div class="gear gear-two" aria-hidden="true">⚙</div>
    <div class="gear gear-three" aria-hidden="true">⚙</div>

    <!-- Name Search Form -->
    <form onsubmit="return false;">

        <div class="gear-icon" aria-hidden="true">⚙</div>

        <h1>Name Verification</h1>

        <p class="subtitle">
            CANDIDATE VERIFICATION SYSTEM
        </p>

        <label for="name">First Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your first name"
            autocomplete="given-name"
        >

        <label for="surname">Last Name</label>
        <input
            type="text"
            id="surname"
            placeholder="Enter your last name"
            autocomplete="family-name"
        >

        <input
            type="button"
            py-click="name_finder"
            value="Search for my name"
        >

    </form>

    <div id="result"></div>

    <py-script src="main.py"></py-script>
</body>
</html>
